  <script>
    function handleProductClick(productCard) {
      const productName = productCard.querySelector('h3').textContent;
      const productPrice = productCard.querySelector('.price').textContent;
      const image = productCard.getAttribute('data-img1');
      const productInfo = productCard.getAttribute('data-info');
      const params = new URLSearchParams({
        product: productName,
        price: productPrice,
        img1: image,
        img2: productCard.getAttribute('data-img2'),
        img3: productCard.getAttribute('data-img3'),
        info: productInfo,
        quantity: '1',
        returnTo: window.location.href
      });
      window.location.href = `product.html?${params}`;
    }

    document.querySelectorAll('.product-card').forEach(card => {
      card.style.cursor = 'pointer';
      card.addEventListener('click', event => {
        handleProductClick(card);
      });
    });

    if ('IntersectionObserver' in window) {
      const productObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('fade-in');
            productObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });

      document.querySelectorAll('.product-card').forEach(card => productObserver.observe(card));
    } else {
      document.querySelectorAll('.product-card').forEach(card => card.classList.add('fade-in'));
    }

    function updateHeaderCartCount() {
      const cart = JSON.parse(localStorage.getItem('shoppingCart') || '[]');
      const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
      document.getElementById('header-cart-count').textContent = totalItems;
    }

    updateHeaderCartCount();
    window.addEventListener('storage', event => {
      if (event.key === 'shoppingCart') updateHeaderCartCount();
    });

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    function filterProducts() {
      const query = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.product-card').forEach(card => {
        const searchableText = `${card.querySelector('h3').textContent} ${card.dataset.info}`.toLowerCase();
        card.style.display = searchableText.includes(query) ? '' : 'none';
      });
    }
    searchBtn.addEventListener('click', filterProducts);
    searchInput.addEventListener('input', filterProducts);
  </script>
