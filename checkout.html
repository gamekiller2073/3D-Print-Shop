<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .checkout-container {
      max-width: 1200px;
      margin: 4rem auto 0 auto;
      background: #23272f;
      border-radius: 14px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.22);
      padding: 2.5rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f1f1f1;
    }
    .checkout-container img {
      width: 100%;
      max-width: 220px;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      object-fit: cover;
      background: #181a1b;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }
    .checkout-container h2 {
      margin: 0 0 0.7rem 0;
      font-size: 2rem;
      color: #4f8cff;
      font-weight: 700;
      text-align: center;
    }
    .checkout-container .price {
      color: #4f8cff;
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      font-weight: 500;
    }
    .checkout-info-row {
      width: 100%;
      margin-bottom: 0.8rem;
      font-size: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkout-label {
      color: #b3b3b3;
      font-weight: 500;
      font-size: 1.22rem;
    }
    .spotify-link {
      color: #1db954;
      word-break: break-all;
      text-decoration: underline;
    }
    .back-btn {
      margin-top: 2rem;
      background: #23272f;
      color: #4f8cff;
      border: 2px solid #4f8cff;
      border-radius: 6px;
      padding: 0.6rem 1.3rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover {
      background: #4f8cff;
      color: #fff;
    }
    .checkout-layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 1.5rem;
      align-items: start;
    }
    .checkout-summary-column,
    .checkout-details-column {
      min-width: 0;
      background: #181a1b;
      border: 1px solid rgba(226, 160, 112, 0.16);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: none;
    }
    .checkout-items-panel,
    .checkout-totals-panel {
      width: 100%;
      box-sizing: border-box;
    }
    .checkout-totals-panel {
      margin-top: 0.8rem;
      padding: 1rem;
      background: #23272f;
      border-radius: 8px;
    }
    .checkout-info-row {
      width: 100%;
      margin: 0 0 0.7rem;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      font-size: 1.05rem;
    }
    .checkout-total-row {
      margin: 0.8rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid rgba(226, 160, 112, 0.25);
      font-size: 1.25rem;
    }
    .checkout-total-row .checkout-label,
    #checkout-total-price {
      color: #e2a070;
      font-weight: 700;
    }
    .checkout-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .checkout-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .checkout-field label {
      color: #f1f1f1;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .checkout-field input,
    .checkout-field textarea,
    .checkout-field select {
      box-sizing: border-box;
      width: 100%;
      padding: 0.75rem 0.85rem;
      border-radius: 6px;
      border: 1px solid rgba(226, 160, 112, 0.65);
      background: #23272f;
      color: #f1f1f1;
      font-size: 1rem;
    }
    .checkout-pay-btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.9rem 1.2rem;
      background: #e2a070;
      color: #211b17;
      border: none;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    .checkout-pay-btn:hover:not(:disabled) {
      background: #f0b887;
    }
    .checkout-pay-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    .checkout-back-btn {
      align-self: flex-start;
      margin-top: 1.5rem;
    }
    @media (max-width: 820px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
      .checkout-container {
        margin-top: 2rem;
      }
    }
    @media (max-width: 480px) {
      .checkout-container {
        width: calc(100% - 1.25rem);
        padding: 1rem;
      }
      .checkout-summary-column,
      .checkout-details-column {
        padding: 1rem;
      }
      .checkout-info-row {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <a href="index.html" class="brand">3D Print Shop</a>
      <nav class="main-menu" aria-label="Main menu">
        <a href="index.html">Home</a>
        <a href="vases.html">Vases</a>
        <a href="fidget-toys.html">Fidget Toys</a>
        <a href="puzzles.html">Puzzles</a>
        <a href="keychains.html">Keychains</a>
        <a href="custom.html">Custom</a>
      </nav>
      <div class="header-tools">
        <div class="search-bar">
          <input type="text" class="search-input" placeholder="Search products..." aria-label="Search products">
          <button class="search-btn" type="button" aria-label="Search">🔍</button>
        </div>
        <a href="cart.html" class="header-cart-link" aria-label="Shopping cart">
          🛒 <span id="header-cart-count">0</span>
        </a>
      </div>
    </div>
  </header>
  <main class="checkout-container">
    <div class="checkout-layout">
      <section class="checkout-summary-column" aria-labelledby="order-summary-heading">
        <h2 id="order-summary-heading">Order Summary</h2>
        <div id="cart-items-summary" class="checkout-items-panel">
          <!-- Cart items will be populated here -->
        </div>
        <div class="checkout-totals-panel">
          <div class="checkout-info-row">
            <span class="checkout-label">Subtotal:</span>
            <span id="checkout-subtotal"></span>
          </div>
          <div class="checkout-info-row">
            <span class="checkout-label">Shipping:</span>
            <span id="checkout-shipping"></span>
          </div>
          <div class="checkout-info-row checkout-total-row">
            <span class="checkout-label">Total:</span>
            <span id="checkout-total-price"></span>
          </div>
        </div>
      </section>

      <section class="checkout-details-column" aria-labelledby="delivery-details-heading">
        <h2 id="delivery-details-heading">Delivery Details</h2>
        <form id="checkout-form" class="checkout-form">
          <div class="checkout-field">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full-name" required>
          </div>
          <div class="checkout-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="checkout-field">
            <label for="address">Address</label>
            <textarea id="address" name="address" required rows="3" placeholder="Straat, huisnummer, postcode en gemeente"></textarea>
            <small id="shipping-region-message">Green Service is alleen beschikbaar binnen 25 km van Leuven.</small>
          </div>
          <div class="checkout-field">
            <label for="shipping-method">Verzending</label>
            <select id="shipping-method" name="shipping-method" required>
              <option value="school">Op school afgeven — Gratis</option>
              <option value="green">Green Service — € 4,00</option>
              <option value="bpost">Bpost — € 7,10</option>
            </select>
          </div>
          <button type="submit" id="submit-btn" class="checkout-pay-btn">Pay</button>
        </form>
      </section>
    </div>
    <a href="index.html" class="back-btn checkout-back-btn">&#8592; Back to Shop</a>
  </main>
  <script src="catalog.js"></script>
  <script>
    let cartItems = [];

    function updateHeaderCartCount() {
      const cart = JSON.parse(localStorage.getItem('shoppingCart') || '[]');
      const count = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
      document.getElementById('header-cart-count').textContent = count;
    }
    updateHeaderCartCount();
    
    function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }
    
    function formatOptions(options) {
      const formattedOptions = [];
      for (const [key, value] of Object.entries(options)) {
        if (key !== 'product' && key !== 'price' && key !== 'img' && key !== 'quantity') {
          const displayKey = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
          formattedOptions.push(`${displayKey}: ${value}`);
        }
      }
      return formattedOptions.join(', ');
    }
    
    function populateCartSummary() {
      const cartItemsSummary = document.getElementById('cart-items-summary');
      cartItemsSummary.innerHTML = '';
      
      if (cartItems.length === 0) {
        cartItemsSummary.innerHTML = '<p style="text-align:center;color:#f1f1f1;">No items in cart</p>';
        return;
      }
      
      cartItems.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.style.cssText = 'display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid #3a4048;';
        if (index === cartItems.length - 1) itemDiv.style.borderBottom = 'none';
        
        itemDiv.innerHTML = `
          <div style="flex:0 0 80px;">
            <img src="${item.img}" alt="${item.product}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;background:#181a1b;">
          </div>
          <div style="flex:1;color:#f1f1f1;">
            <div style="font-weight:600;color:#4f8cff;margin-bottom:0.3rem;">${item.product}</div>
            <div style="font-size:0.9rem;color:#b0b0b0;margin-bottom:0.5rem;">${formatOptions(item.options)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="color:#f1f1f1;">Qty: ${item.quantity}</span>
              <span style="color:#4f8cff;font-weight:600;">${item.price}</span>
            </div>
          </div>
        `;
        cartItemsSummary.appendChild(itemDiv);
      });
    }
    
    function updateTotals() {
      let subtotal = 0;
      let shippingCost = 0;
      let hasUnpricedItems = false;
      
      cartItems.forEach(item => {
        if (Number.isInteger(item.priceCents)) {
          subtotal += item.priceCents * item.quantity;
        } else {
          hasUnpricedItems = true;
        }
      });
      
      const shippingMethod = document.getElementById('shipping-method').value;
      if (shippingMethod === 'green') {
        shippingCost = 400;
      } else if (shippingMethod === 'bpost') {
        shippingCost = 710;
      }
      
      const total = subtotal + shippingCost;
      
      document.getElementById('checkout-subtotal').textContent = formatShopPrice(subtotal);
      document.getElementById('checkout-shipping').textContent = shippingMethod === 'school' ? 'Gratis' : formatShopPrice(shippingCost);
      document.getElementById('checkout-total-price').textContent = hasUnpricedItems ? 'Price quote required' : formatShopPrice(total);
      const submitButton = document.getElementById('submit-btn');
      submitButton.disabled = hasUnpricedItems;
      submitButton.textContent = hasUnpricedItems ? 'Price quote required' : 'Pay';
    }
    
    const LEUVEN_CENTER = { latitude: 50.8796, longitude: 4.7005 };
    const GREEN_SERVICE_RADIUS_KM = 25;
    let greenServiceAvailability = null;
    let greenServiceLatitude = null;
    let greenServiceLongitude = null;
    let greenAvailabilityRequest = 0;

    function distanceInKm(latitude1, longitude1, latitude2, longitude2) {
      const toRadians = degrees => degrees * Math.PI / 180;
      const earthRadiusKm = 6371;
      const deltaLatitude = toRadians(latitude2 - latitude1);
      const deltaLongitude = toRadians(longitude2 - longitude1);
      const a = Math.sin(deltaLatitude / 2) ** 2
        + Math.cos(toRadians(latitude1)) * Math.cos(toRadians(latitude2))
        * Math.sin(deltaLongitude / 2) ** 2;
      return earthRadiusKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function checkGreenServiceRadius(address) {
      if (!address.trim() || address.length < 8) {
        greenServiceAvailability = null;
        updateGreenServiceAvailability();
        return;
      }

      const requestId = ++greenAvailabilityRequest;
      try {
        let response = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=be&q=${encodeURIComponent(address)}`);
        if (!response.ok) throw new Error('Address lookup failed');
        let results = await response.json();

        if (!results.length) {
          const postcodeAndCity = address.match(/\b(\d{4})\s+([\p{L}-]+)/u);
          if (postcodeAndCity) {
            response = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=be&q=${encodeURIComponent(`${postcodeAndCity[1]} ${postcodeAndCity[2]}, Belgium`)}`);
            if (response.ok) results = await response.json();
          }
        }

        if (requestId !== greenAvailabilityRequest) return;

        if (!results.length) {
          greenServiceAvailability = false;
          greenServiceLatitude = null;
          greenServiceLongitude = null;
        } else {
          greenServiceLatitude = Number(results[0].lat);
          greenServiceLongitude = Number(results[0].lon);
          const distance = distanceInKm(
            LEUVEN_CENTER.latitude,
            LEUVEN_CENTER.longitude,
            greenServiceLatitude,
            greenServiceLongitude
          );
          greenServiceAvailability = distance <= GREEN_SERVICE_RADIUS_KM;
        }
      } catch {
        if (requestId !== greenAvailabilityRequest) return;
        greenServiceAvailability = null;
        greenServiceLatitude = null;
        greenServiceLongitude = null;
      }
      updateGreenServiceAvailability();
    }

    let greenCheckTimeout;
    
    function updateGreenServiceAvailability() {
      const shippingSelect = document.getElementById('shipping-method');
      const greenOption = shippingSelect.querySelector('option[value="green"]');
      const message = document.getElementById('shipping-region-message');

      if (greenServiceAvailability === null) {
        greenOption.disabled = true;
        message.textContent = 'Voer een volledig adres in om Green Service te controleren.';
        message.style.color = '#c6cbc5';
      } else if (greenServiceAvailability) {
        greenOption.disabled = false;
        message.textContent = 'Green Service is beschikbaar binnen 25 km van Leuven.';
        message.style.color = '#75c68b';
      } else {
        greenOption.disabled = true;
        message.textContent = 'Green Service is niet beschikbaar: meer dan 25 km van Leuven.';
        message.style.color = '#c6cbc5';
        if (shippingSelect.value === 'green') {
          shippingSelect.value = 'school';
          updateTotals();
        }
      }
    }
    
    // Initialize cart from URL parameters or localStorage
    function initializeCart() {
      const cartParam = getQueryParam('cart');
      if (cartParam) {
        try {
          // Decode the URL-encoded cart data and parse JSON
          const decodedCart = decodeURIComponent(cartParam);
          cartItems = JSON.parse(decodedCart);
          console.log('Cart items loaded from URL:', cartItems);
        } catch (e) {
          console.error('Error parsing cart data from URL:', e);
          // Fallback: try to get from localStorage
          const cart = localStorage.getItem('shoppingCart');
          cartItems = cart ? JSON.parse(cart) : [];
          console.log('Fallback to localStorage cart:', cartItems);
        }
      } else {
        // Fallback: try to get from localStorage
        const cart = localStorage.getItem('shoppingCart');
        cartItems = cart ? JSON.parse(cart) : [];
        console.log('Cart items loaded from localStorage:', cartItems);
      }
      
      cartItems = cartItems.map(item => {
        try {
          const priceCents = getShopPriceCents(item.product, item.options || {});
          return { ...item, priceCents, price: formatShopPrice(priceCents) };
        } catch {
          return { ...item, priceCents: null, price: 'Price quote required' };
        }
      });

      populateCartSummary();
      updateTotals();
    }
    
    // Initialize on page load
    initializeCart();
    document.getElementById('shipping-method').addEventListener('change', updateTotals);
    document.getElementById('address').addEventListener('input', event => {
      clearTimeout(greenCheckTimeout);
      greenServiceAvailability = null;
      updateGreenServiceAvailability();
      greenCheckTimeout = setTimeout(() => {
        checkGreenServiceRadius(event.target.value);
      }, 650);
    });
  </script>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    // Initialize EmailJS with your public key
    emailjs.init('y7LqCrsi8J-atkUez');
  </script>
  <script>
    const checkoutForm = document.getElementById('checkout-form');
    const submitBtn = document.getElementById('submit-btn');
    checkoutForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Redirecting...';
      
      // Gather form info
      const email = document.getElementById('email').value;
      const address = document.getElementById('address').value;
      const fullName = document.getElementById('full-name').value;
      const shippingSelect = document.getElementById('shipping-method');
      const shippingMethod = shippingSelect.value;
      const shippingNames = {
        school: 'Op school afgeven',
        green: 'Green Service',
        bpost: 'Bpost'
      };
      const shippingName = shippingNames[shippingMethod];
      const shippingCostCents = shippingMethod === 'green' ? 400 : shippingMethod === 'bpost' ? 710 : 0;
      const totalPrice = document.getElementById('checkout-total-price').textContent;
      
      // Create clean, formatted order summary for email
      let orderSummary = '';
      
      // Build the complete order summary with all products
      cartItems.forEach((item, index) => {
        const productNum = index + 1;
        orderSummary += `Product ${productNum}:\n`;
        orderSummary += `Name: ${item.product}\n`;
        orderSummary += `Quantity: ${item.quantity}\n`;
        orderSummary += `Price: ${item.price}\n`;
        
        // Add all available options for this product
        if (item.options.color) orderSummary += `Color: ${item.options.color}\n`;
        if (item.options.textColor) orderSummary += `Text Color: ${item.options.textColor}\n`;
        if (item.options.baseColor) orderSummary += `Base Color: ${item.options.baseColor}\n`;
        if (item.options.outerColor) orderSummary += `Outer Color: ${item.options.outerColor}\n`;
        if (item.options.innerColor) orderSummary += `Inner Color: ${item.options.innerColor}\n`;
        if (item.options.boxColor) orderSummary += `Box Color: ${item.options.boxColor}\n`;
        if (item.options.fingerColor) orderSummary += `Finger Color: ${item.options.fingerColor}\n`;
        if (item.options.batteryType) orderSummary += `Battery Type: ${item.options.batteryType}\n`;
        if (item.options.spotify) orderSummary += `Spotify: ${item.options.spotify}\n`;
        if (item.options.shape) orderSummary += `Shape: ${item.options.shape}\n`;
        if (item.options.size) orderSummary += `Size: ${item.options.size}\n`;
        if (item.options.name) orderSummary += `Name: ${item.options.name}\n`;
        if (item.options.guitarType) orderSummary += `Guitar Type: ${item.options.guitarType}\n`;
        orderSummary += `\n`;
      });
      
      // Add customer details and total at the end
      orderSummary += `Customer Details:\n`;
      orderSummary += `Name: ${fullName}\n`;
      orderSummary += `Address: ${address}\n`;
      orderSummary += `Email: ${email}\n`;
      orderSummary += `Shipping: ${shippingName} - ${shippingCostCents === 0 ? 'Gratis' : formatShopPrice(shippingCostCents)}\n`;
      orderSummary += `Total Amount Paid: ${totalPrice}\n`;
      
      // Calculate total quantity of all items
      const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      
      // Simple email data with just the essential variables
      let emailData = {
        // Customer info
        customerName: fullName,
        customerAddress: address,
        customerEmail: email,
        totalAmount: totalPrice,
        itemCount: cartItems.length, // Number of different products
        totalItems: totalItems, // Total quantity of all items
        
        // Complete formatted order
        orderSummary: orderSummary,
        
        // For backward compatibility - first product details
        product: cartItems.length > 0 ? cartItems[0].product : 'Multiple Items',
        price: cartItems.length > 0 ? cartItems[0].price : totalPrice,
        quantity: totalItems
      };
      
      // Send order email via EmailJS with all product details
      try {
        await emailjs.send('service_we3cm9f', 'template_bubq4ev', emailData);
      } catch (err) {
        alert('Order email could not be sent, but you will still be redirected to payment.');
      }
      
      // After sending the email, send order to dashboard
      fetch('http://localhost:3000/api/orders', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          customer: {
            name: emailData.customerName,
            email: emailData.customerEmail,
            phone: ''
          },
          items: cartItems.map(item => {
            // Parse price from formatted string "€ 1,00" to number
            const priceStr = item.price.replace('€ ', '').replace(',', '.');
            const priceNumber = parseFloat(priceStr) || 0;
            
            // Build item object with ALL options
            const itemData = {
              name: item.product,
              quantity: item.quantity,
              price: priceNumber,  // Send as number, not formatted string
              // Include ALL options from item.options
              ...(item.options || {})
            };
            
            return itemData;
          }),
          // Parse total price from formatted string
          total: parseFloat(totalPrice.replace('€ ', '').replace(',', '.')) || 0,
          status: 'pending',
          shippingAddress: address,
          shippingMethod,
          shippingName,
          shippingCostCents
        })
      }).catch(err => {
        console.error('Dashboard update failed:', err);
      });


      // Send to backend
      try {
        const response = await fetch('https://threed-print-shop-xhew.onrender.com/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cartItems,
            totalPrice,
            email,
            address,
            fullName,
            shippingMethod,
            shippingCostCents,
            greenServiceLatitude,
            greenServiceLongitude
          })
        });
        const data = await response.json();
        if (data.url) {
          // Clear cart after successful order
          localStorage.removeItem('shoppingCart');
          window.location.href = data.url;
        } else {
          alert('Error: ' + (data.error || 'Could not create Stripe session.'));
          submitBtn.disabled = false;
          submitBtn.textContent = 'Pay';
        }
      } catch (err) {
        alert('Network error: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pay';
      }
    });
  </script>
</body>
