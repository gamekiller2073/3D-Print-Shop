  <script>
    const stripe = Stripe('pk_live_51RhEGyAUikPASWrhSIJC9JwDohwQc0SnYmiWYIXlvm8XnqNNLpBlJykIi8A0ulgecCDXl3nVLfIoO9sLRQ17IkPp00VFiODP5r');
    emailjs.init('y7LqCrsi8J-atkUez');

    function handleProductClick(productCard) {
      if (productCard.classList.contains('request-card')) return;
      var productName = productCard.querySelector('h3').textContent;
      var productPrice = productCard.querySelector('.price').textContent;
      var productImg1 = productCard.getAttribute('data-img1');
      var productImg2 = productCard.getAttribute('data-img2');
      var productImg3 = productCard.getAttribute('data-img3');
      var productInfo = productCard.getAttribute('data-info');
      var quantity = '1';
      window.location.href = `product.html?product=${encodeURIComponent(productName)}&price=${encodeURIComponent(productPrice)}&img1=${encodeURIComponent(productImg1)}&img2=${encodeURIComponent(productImg2)}&img3=${encodeURIComponent(productImg3)}&info=${encodeURIComponent(productInfo)}&quantity=${encodeURIComponent(quantity)}&returnTo=${encodeURIComponent(window.location.href)}`;
    }

    document.querySelectorAll('.product-card').forEach(card => {
      card.style.cursor = 'pointer';
      card.addEventListener('click', function(e) {
        if (e.target.closest('#open-request-modal')) return;
        handleProductClick(this);
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('fade-in');
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.product-card').forEach(card => observer.observe(card));

    function getCart() {
      const cart = localStorage.getItem('shoppingCart');
      return cart ? JSON.parse(cart) : [];
    }
    function updateHeaderCartCount() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
      const el = document.getElementById('header-cart-count');
      if (el) el.textContent = totalItems;
    }
    updateHeaderCartCount();
    window.addEventListener('storage', function(e) {
      if (e.key === 'shoppingCart') updateHeaderCartCount();
    });

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const productCards = document.querySelectorAll('.product-card');
    const productGallery = document.getElementById('products');

    function performSearch() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      let visibleCount = 0;
      productCards.forEach(card => {
        const productName = card.querySelector('h3').textContent.toLowerCase();
        const productInfo = card.getAttribute('data-info').toLowerCase();
        if (productName.includes(searchTerm) || productInfo.includes(searchTerm) || searchTerm === '') {
          card.style.display = 'block';
          card.style.animation = 'fadeIn 0.3s ease-in';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });
      if (searchTerm !== '' && visibleCount < productCards.length) {
        productGallery.style.justifyContent = 'center';
      } else {
        productGallery.style.justifyContent = 'start';
      }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keyup', performSearch);
  </script>
